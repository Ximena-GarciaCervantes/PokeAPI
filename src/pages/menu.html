<!doctype html>
<html lang="es" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Menú Pokédex</title>
    <!-- CDN Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
  </head>
  <body class="bg-zinc-900 min-h-screen flex flex-col justify-between">
    
    <!-- HEADER -->
    <header class="bg-red-600 border-b border-gray-800">
      <div class="mx-auto max-w-7xl px-4 sm:px-6 lg:px-8">
        <div class="flex h-16 items-center justify-between">
          <div class="flex-1 md:flex md:items-center md:gap-12">
            <a class="block text-teal-600 dark:text-teal-300" href="../index.html">
              <span class="sr-only">Home</span>
              <img
                src="/src/assets/img/pokebola.png"
                alt="pokebola"
                class="h-12 transition-transform duration-500 ease-in-out hover:scale-125"
              />
            </a>
          </div>

          <!-- Links de Navegación -->
          <div class="hidden sm:ml-6 sm:block">
            <div class="flex space-x-2 font-mono text-xs font-bold">
              <a
                href="../index.html"
                class="text-lg rounded-lg px-3 py-2 text-white hover:bg-red-700 transition-colors"
              >
                POKÉDEX
              </a>
              <button type="button" id="btn-legendarios" class="text-lg rounded-lg px-3 py-2 text-white hover:bg-red-700 transition-colors cursor-pointer">
                LEGENDARIOS
              </button>
              <button type="button" id="btn-generaciones" class="text-lg rounded-lg px-3 py-2 text-white hover:bg-red-700 transition-colors cursor-pointer">
                GENERACIONES
              </button>
              <button type="button" id="btn-top-stats" class="text-lg rounded-lg px-3 py-2 text-white hover:bg-red-700 transition-colors cursor-pointer">
                TOP STATS
              </button>
            </div>
          </div>
        </div>
      </div>
    </header>

    <!-- CONTENIDO PRINCIPAL -->
    <main class="max-w-6xl mx-auto p-4 sm:p-6 w-full flex-1">
      
      <!-- DASHBOARD (Se muestra al entrar a la página) -->
      <section id="bienvenida-dashboard" class="mb-8 grid grid-cols-1 md:grid-cols-3 gap-4 font-mono">
        <div class="bg-zinc-950 border-2 border-red-800 rounded-2xl p-5 shadow-lg flex flex-col items-center text-center">
          <span class="text-3xl mb-2">⭐</span>
          <h3 class="text-white font-bold text-sm">LEGENDARIOS</h3>
          <p class="text-zinc-400 text-xs mt-1">Consulta las estadísticas de los Pokémon más poderosos.</p>
        </div>
        <div class="bg-zinc-950 border-2 border-red-800 rounded-2xl p-5 shadow-lg flex flex-col items-center text-center">
          <span class="text-3xl mb-2">🌐</span>
          <h3 class="text-white font-bold text-sm">9 GENERACIONES</h3>
          <p class="text-zinc-400 text-xs mt-1">Explora las especies agrupadas por su región de origen.</p>
        </div>
        <div class="bg-zinc-950 border-2 border-red-800 rounded-2xl p-5 shadow-lg flex flex-col items-center text-center">
          <span class="text-3xl mb-2">🔥</span>
          <h3 class="text-white font-bold text-sm">TOP STATS</h3>
          <p class="text-zinc-400 text-xs mt-1">Descubre los líderes en Puntos de Vida, Ataque y Defensa.</p>
        </div>
      </section>

      <!-- BARRA DE BOTONES PARA FILTRAR GENERACIONES -->
      <div id="contenedor-generaciones" class="hidden mb-6 flex flex-wrap gap-2 justify-center font-mono text-xs font-bold">
        <button data-gen="1" class="btn-gen bg-zinc-800 hover:bg-red-700 text-white py-2 px-3 rounded-lg border border-zinc-700 transition-colors cursor-pointer">GEN 1 (Kanto)</button>
        <button data-gen="2" class="btn-gen bg-zinc-800 hover:bg-red-700 text-white py-2 px-3 rounded-lg border border-zinc-700 transition-colors cursor-pointer">GEN 2 (Johto)</button>
        <button data-gen="3" class="btn-gen bg-zinc-800 hover:bg-red-700 text-white py-2 px-3 rounded-lg border border-zinc-700 transition-colors cursor-pointer">GEN 3 (Hoenn)</button>
        <button data-gen="4" class="btn-gen bg-zinc-800 hover:bg-red-700 text-white py-2 px-3 rounded-lg border border-zinc-700 transition-colors cursor-pointer">GEN 4 (Sinnoh)</button>
        <button data-gen="5" class="btn-gen bg-zinc-800 hover:bg-red-700 text-white py-2 px-3 rounded-lg border border-zinc-700 transition-colors cursor-pointer">GEN 5 (Unova)</button>
        <button data-gen="6" class="btn-gen bg-zinc-800 hover:bg-red-700 text-white py-2 px-3 rounded-lg border border-zinc-700 transition-colors cursor-pointer">GEN 6 (Kalos)</button>
        <button data-gen="7" class="btn-gen bg-zinc-800 hover:bg-red-700 text-white py-2 px-3 rounded-lg border border-zinc-700 transition-colors cursor-pointer">GEN 7 (Alola)</button>
        <button data-gen="8" class="btn-gen bg-zinc-800 hover:bg-red-700 text-white py-2 px-3 rounded-lg border border-zinc-700 transition-colors cursor-pointer">GEN 8 (Galar)</button>
        <button data-gen="9" class="btn-gen bg-zinc-800 hover:bg-red-700 text-white py-2 px-3 rounded-lg border border-zinc-700 transition-colors cursor-pointer">GEN 9 (Paldea)</button>
      </div>

      <!-- CONTENEDOR DE LA TABLA LEGENDARIOS -->
      <div id="contenedor-tabla" class="hidden w-full overflow-x-auto rounded-2xl border-4 border-red-800 bg-zinc-950 p-2 shadow-[0_10px_25px_rgba(0,0,0,0.8)]">
        
        <h2 class="text-white font-mono font-black text-lg p-3 tracking-wider flex items-center gap-2 border-b border-zinc-800">
          <span class="w-3 h-3 bg-yellow-400 rounded-full animate-pulse"></span>
          <span id="txt-titulo-tabla">POKÉMON</span>
        </h2>

        <table class="w-full text-left font-mono text-xs text-zinc-200 border-collapse">
          <thead class="bg-red-950/80 text-emerald-400 font-bold uppercase border-b-2 border-red-800 divide-x divide-red-800">
            <tr>
              <th class="p-3 text-center"># ID</th>
              <th class="p-3 text-center">Sprite</th>
              <th class="p-3 text-center">Nombre</th>
              <th class="p-3 text-center">Tipos</th>
              <th class="p-3 text-center">HP</th>
              <th class="p-3 text-center">ATK</th>
              <th class="p-3 text-center">DEF</th>
            </tr>
          </thead>
          <tbody id="tabla-pokemon" class="divide-y divide-zinc-700/60">
          </tbody>
        </table>

      </div>

    </main>
    <script src="/src/assets/menu.js"></script>
  </body>
</html>
